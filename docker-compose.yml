services:
  frontend:
    build: ./frontend
    depends_on:
      - server
    networks:
      - coolify
    environment:
      - NEXT_PUBLIC_SERVER_URL="http://server:9000"
      - NEXT_PUBLIC_APP_NAME="Stocktrix"
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.entrypoints=https
      - traefik.http.routers.frontend.rule=Host(`stocktrix.online`)
      - traefik.http.services.frontend.loadbalancer.server.port=3000
      - traefik.http.routers.frontend.tls=true
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt

  server:
    build: ./server
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.http.routers.server.entrypoints=https
      - traefik.http.routers.server.rule=Host(`api.stocktrix.online`)
      - traefik.http.services.server.loadbalancer.server.port=9000
      - traefik.http.routers.server.tls=true
      - traefik.http.routers.server.tls.certresolver=letsencrypt

