services:
  frontend:
    build:
      context: ./frontend
      args:
        - SERVER_DOMAIN_NAME=${SERVER_DOMAIN_NAME}
        - APP_NAME=${APP_NAME}
    expose:
      - 3000
    depends_on:
      - server
    environment:
      - SERVER_DOMAIN_NAME=${SERVER_DOMAIN_NAME}
      - APP_NAME=${APP_NAME}

  server:
    build:
      context: ./server
      args:
        - APP_DOMAIN_NAME=${APP_DOMAIN_NAME}
    expose:
      - 9000
    environment:
      - APP_DOMAIN_NAME=${APP_DOMAIN_NAME}
