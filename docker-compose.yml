services:
  frontend:
    build: ./frontend
    expose:
      - 3000
    depends_on:
      - server
    environment:
      - SERVER_DOMAIN_NAME=${SERVER_DOMAIN_NAME}
      - APP_NAME=${APP_NAME}

  server:
    build: ./server
    expose:
      - 9000
    environment:
      - APP_DOMAIN_NAME=${APP_DOMAIN_NAME}
