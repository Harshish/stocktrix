services:
  frontend:
    build: ./frontend
    expose:
      - 3000
    depends_on:
      - server
    environment:
      - NEXT_PUBLIC_SERVER_URL=$SERVER_DOMAIN_NAME
      - NEXT_PUBLIC_APP_NAME=$APP_NAME

  server:
    build: ./server
    expose:
      - 9000
    environment:
      - APP_DOMAIN_NAME=$APP_DOMAIN_NAME
