services:
  frontend:
    build:
      context: ./frontend
      args:
        - SERVER_DOMAIN_NAME=${SERVER_DOMAIN_NAME}
        - APP_NAME=${APP_NAME}
    environment:
      - API_KEY=${API_KEY}
    expose:
      - 3000
    depends_on:
      - server
    env_file:
      - ./frontend/.env.production

  server:
    build:
      context: ./server
    expose:
      - 9000
    environment:
      - API_KEY=${API_KEY}
    env_file:
      - ./server/.env.production
